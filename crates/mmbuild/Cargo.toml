[package]
name = "mmbuild"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MicroMiner OS builder: firmware fetch, rootfs, cross-compile, patch, repack, tar."

[[bin]]
name = "mmbuild"
path = "src/main.rs"

[dependencies]
mmcore = { path = "../mmcore" }
superimg = { path = "../superimg" }
mmadb = { path = "../mmadb" }
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
walkdir.workspace = true
num_cpus.workspace = true
ureq.workspace = true
aes.workspace = true
ecb.workspace = true
md-5.workspace = true
sha2.workspace = true
flate2.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
