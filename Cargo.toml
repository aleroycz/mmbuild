[workspace]
resolver = "2"
members = ["crates/mmcore", "crates/superimg", "crates/mmbuild", "crates/mmadb"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["MicroMiner builder"]

# Shared dependency versions so every crate pulls the same build.
[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "wrap_help"] }
crossterm = "0.27"
walkdir = "2"
num_cpus = "1"
ureq = { version = "2", features = ["tls", "cookies"] }
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
